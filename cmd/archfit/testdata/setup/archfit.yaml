name: archfit
on:
  pull_request:
  push:
    branches: ['main']
  merge_group:
    types: [checks_requested]

permissions:
  contents: read
  id-token: write

jobs:
  archfit:
    runs-on: ubuntu-latest
    steps:
      - uses: coupling-dev/archfit-action@aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa # v0.10.0
        with:
          endpoint: https://app.coupling.dev
